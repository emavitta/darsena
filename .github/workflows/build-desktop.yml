name: Build desktop

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS · Apple Silicon
            os: macos-15
            target: macos-arm64
            package: mac dmg zip --arm64
          - name: Windows · x64
            os: windows-2025
            target: windows-x64
            package: win nsis zip --x64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
          run_install: false
      - name: Check version tag
        run: node -e "if(process.env.GITHUB_REF_TYPE==='tag' && process.env.GITHUB_REF_NAME!=='v'+JSON.parse(require('fs').readFileSync('package.json')).version) throw Error('Tag must match package.json version')"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types
        run: pnpm typecheck
      - name: Test native process supervision, Git and task discovery
        run: pnpm test
      - name: Build application
        run: pnpm build
      - name: Package installers
        run: pnpm exec electron-builder --${{ matrix.package }} --publish never
      - name: Select packaged macOS application
        if: runner.os == 'macOS'
        run: echo "DARSENA_EXECUTABLE=$PWD/release/mac-arm64/Darsena.app/Contents/MacOS/Darsena" >> "$GITHUB_ENV"
      - name: Install Windows application without administrator elevation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = Join-Path $pwd "release/Darsena-$version-windows-x64.exe"
          $destination = Join-Path $env:RUNNER_TEMP 'Darsena installed'
          $process = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$destination" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $executable = Join-Path $destination 'Darsena.exe'
          if (!(Test-Path $executable)) { throw "Installed executable missing: $executable" }
          "DARSENA_EXECUTABLE=$executable" >> $env:GITHUB_ENV
      - name: Test installed app, task lifecycle, window close and project removal
        run: |
          node --import tsx tests/ui-smoke.mjs
          node --import tsx tests/project-removal-smoke.mjs
      - name: Record checksums and exact source commit
        run: node scripts/release-manifest.mjs
      - name: Upload installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darsena-${{ matrix.target }}
          path: |
            release/*.dmg
            release/*.exe
            release/*-mac.zip
            release/*-windows-x64.zip
            release/SHA256SUMS-*.txt
            release/build-*.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload desktop screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-screenshots-${{ matrix.target }}
          path: test-results/*.png
          if-no-files-found: ignore
          retention-days: 7
