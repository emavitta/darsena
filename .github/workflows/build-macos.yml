name: Build macOS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: macOS · Apple Silicon
    runs-on: macos-15
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
          run_install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm typecheck

      - name: Test Git, folders, task discovery and process cleanup
        run: pnpm test

      - name: Build the application
        run: pnpm build

      - name: Test the desktop lifecycle and project removal
        run: |
          node --import tsx tests/ui-smoke.mjs
          node --import tsx tests/project-removal-smoke.mjs

      - name: Package unsigned DMG and ZIP
        run: pnpm exec electron-builder --mac dmg zip --arm64 --publish never

      - name: Verify downloads and record their source
        working-directory: release
        run: |
          for image in Darsena-*-arm64.dmg; do hdiutil verify "$image"; done
          for archive in Darsena-*-arm64-mac.zip; do unzip -tq "$archive"; done
          shasum -a 256 Darsena-*-arm64.dmg Darsena-*-arm64-mac.zip > SHA256SUMS.txt
          printf '%s\n' "$GITHUB_SHA" > SOURCE_COMMIT.txt

      - name: Upload downloadable build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darsena-macos-arm64-${{ github.sha }}
          path: |
            release/*.dmg
            release/*-mac.zip
            release/SHA256SUMS.txt
            release/SOURCE_COMMIT.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload screenshots if a desktop check fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-test-screenshots
          path: test-results/*.png
          if-no-files-found: ignore
          retention-days: 7
