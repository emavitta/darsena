name: Build macOS

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: macOS · ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            label: Apple Silicon
            runner: macos-15
            appDirectory: mac-arm64
          - arch: x64
            label: Intel
            runner: macos-15-intel
            appDirectory: mac
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      DARSENA_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
          run_install: false

      - name: Check release tag matches the package version
        run: node -e "if(process.env.GITHUB_REF_TYPE==='tag' && process.env.GITHUB_REF_NAME!=='v'+JSON.parse(require('fs').readFileSync('package.json')).version) throw Error('Tag must match package.json version')"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm typecheck

      - name: Test Git, folders, task discovery and process cleanup
        run: pnpm test

      - name: Build the application
        run: pnpm build

      - name: Package Developer ID signed and notarized DMG and ZIP
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          CSC_NAME: ${{ secrets.MAC_SIGNING_IDENTITY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          : "${CSC_LINK:?Missing signing certificate}"
          : "${CSC_KEY_PASSWORD:?Missing certificate password}"
          : "${APPLE_API_KEY_CONTENT:?Missing notarization key}"
          export APPLE_API_KEY="$RUNNER_TEMP/darsena-notary.p8"
          trap 'rm -f "$APPLE_API_KEY"' EXIT
          umask 077
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY"
          pnpm exec electron-builder --config build/signed-macos.cjs --mac dmg zip --${{ matrix.arch }} --publish never

      - name: Verify Developer ID, notarization ticket and Gatekeeper
        env:
          DARSENA_REQUIRE_NOTARIZATION: '1'
        run: node scripts/verify-macos.mjs

      - name: Test the packaged app lifecycle and project removal
        env:
          DARSENA_EXECUTABLE: ${{ github.workspace }}/release/${{ matrix.appDirectory }}/Darsena.app/Contents/MacOS/Darsena
        run: |
          desktop_failures=0
          for desktop_test in ui project-removal git story-scroll mcp preferences tooltip task-readability worktree-switcher android; do
            node --import tsx "tests/${desktop_test}-smoke.mjs" || desktop_failures=1
          done
          exit "$desktop_failures"

      - name: Verify downloads and record their source
        working-directory: release
        run: |
          for image in Darsena-*-${{ matrix.arch }}.dmg; do hdiutil verify "$image"; done
          for archive in Darsena-*-${{ matrix.arch }}-mac.zip; do unzip -tq "$archive"; done
          node ../scripts/release-manifest.mjs

      - name: Upload downloadable build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darsena-macos-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*-mac.zip
            release/SHA256SUMS-macos-${{ matrix.arch }}.txt
            release/build-macos-${{ matrix.arch }}.json
            release/${{ matrix.arch }}-mac.yml
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload screenshots if a desktop check fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-test-screenshots-${{ matrix.arch }}
          path: test-results/*.png
          if-no-files-found: ignore
          retention-days: 7
