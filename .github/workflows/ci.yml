name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate macOS
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types
        run: pnpm typecheck
      - name: Test Git, folders, task discovery and process cleanup
        run: pnpm test
      - name: Build the application
        run: pnpm build
      - name: Check desktop lifecycle and project removal
        run: |
          desktop_failures=0
          for desktop_test in ui project-removal git story-scroll mcp preferences task-readability worktree-switcher android; do
            node --import tsx "tests/${desktop_test}-smoke.mjs" || desktop_failures=1
          done
          exit "$desktop_failures"
      - name: Save screenshots if a desktop check fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-desktop-screenshots
          path: test-results/*.png
          if-no-files-found: ignore
          retention-days: 7
